name: iosApp
options:
  bundleIdPrefix: com.nursify
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    dependencies:
      - target: WatchApp
        embed: true
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Nursify
        # Backend base URL — override per configuration (dev/staging/prod) here,
        # or at runtime via a UserDefaults/launch-arg `APIBaseURL`. See
        # APIClient.resolveBaseURL. Concept content works offline regardless.
        APIBaseURL: http://192.168.1.194:8081
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Nursify connects to a backend running on your local network for development."
        NSMicrophoneUsageDescription: "Nursify uses your microphone to record voice notes during capture."
        NSSpeechRecognitionUsageDescription: "Nursify transcribes your voice notes on-device so nothing leaves your phone before you review it."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nursify.ios
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: W5A6QAYASM

  WatchApp:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Nursify
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.nursify.ios
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "Nursify uses your microphone to record voice memos, sent to your phone to finish and review."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nursify.ios.watchkitapp
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: W5A6QAYASM

# Explicit SHARED schemes (committed to the repo) so everyone gets the same
# run setup instead of Xcode's per-user auto-schemes. Select "Nursify Watch"
# with an Apple Watch destination and Run to install the watch app directly —
# Xcode also installs the companion iPhone app, so it lands on the watch's app
# grid and persists (unlike a manual `simctl install`, which the sim reaps).
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  Nursify Watch:
    build:
      targets:
        WatchApp: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
