name: iosApp
options:
  bundleIdPrefix: com.nursify
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Nursify
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Nursify connects to a backend running on your local network for development."
        NSMicrophoneUsageDescription: "Nursify uses your microphone to record voice notes during capture."
        NSSpeechRecognitionUsageDescription: "Nursify transcribes your voice notes on-device so nothing leaves your phone before you review it."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nursify.ios
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: L89T4834AJ
